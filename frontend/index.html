<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Vyapar-Mitra" />
  <!-- Set theme before first paint to avoid a flash of the wrong theme.
       Must stay in sync with getInitialThemeMode() in src/context/PredXContext.tsx -->
  <script>
    (function () {
      try {
        var m = localStorage.getItem('predx-theme-mode');
        if (m !== 'light' && m !== 'dark') {
          m = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        var r = document.documentElement;
        r.classList.add(m === 'light' ? 'theme-light' : 'theme-dark');
        r.setAttribute('data-theme', m === 'light' ? 'algolight' : 'algodark');
      } catch (e) {}
    })();
  </script>
  <title>Vyapar-Mitra</title>
  <!-- Google Fonts: Space Grotesk, Manrope, Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <!-- Material Symbols for icons -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <link rel="icon" type="image/x-icon" href="/assets/icon.png">
  <link rel="apple-touch-icon" href="/assets/logo.png">
</head>

<body class="font-body">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- ElevenLabs ConvAI Widget — script only; the <elevenlabs-convai> element is
       mounted by DashboardLayout after wallet connect so it stays hidden on the login screen. -->
  <script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>
</body>

</html>
